name: Terraform Destroy
on:
 workflow_dispatch:

jobs:
  Destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_extra_cidrs: ${{ secrets.TF_VAR_extra_cidrs }}
      TF_VAR_in_gihub_action: true
      BACKEND_BUCEKT_NAME: ${{ secrets.BACKEND_BUCEKT_NAME }}
      BACKEND_BUCKET_KEY: ${{ secrets.BACKEND_BUCKET_KEY }}
      BACKEND_BUCKET_REGION: ${{ secrets.BACKEND_BUCKET_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: create backend.tf
      run: |
        cat <<EOF > backend.tf
          terraform {
            backend "s3" {
              bucket = "$BACKEND_BUCEKT_NAME"
              key    = "$BACKEND_BUCKET_KEY"
              region = "$BACKEND_BUCKET_KEY"
            }
          }
        EOF

    - uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.12.5

    - name: Tofu Init
      id: init
      run: tofu init

    - name: Tofu Plan -Destroy
      run: terraform plan -destroy
      continue-on-error: true

    - name: Tofu Destroy
      id: destroy
      run: tofu destroy -auto-approve