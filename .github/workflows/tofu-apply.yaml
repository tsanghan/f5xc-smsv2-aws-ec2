name: Tofu Apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Pre-Deploy:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was triggered by a ${{ github.event_name }} event"
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

  deploy:
    name: Deploy
    needs: Pre-Deploy
    runs-on: ubuntu-latest
    env:
      VES_P12_PASSWORD: ${{ secrets.VES_P12_PASSWORD }}
      VES_P12_CONTENT: ${{ secrets.VES_P12_CONTENT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_extra_cidrs: ${{ secrets.TF_VAR_extra_cidrs }}
      TF_VAR_public_key: ${{ secrets.TF_VAR_public_key }}
      TF_VAR_in_github_action: true
      BACKEND_BUCEKT_NAME: ${{ secrets.BACKEND_BUCEKT_NAME }}
      BACKEND_BUCKET_KEY: ${{ secrets.BACKEND_BUCKET_KEY }}
      BACKEND_BUCKET_REGION: ${{ secrets.BACKEND_BUCKET_REGION }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: create backend.tf & variables.tf
      run: |
        cat <<EOF > backend.tf
        terraform {
          backend "s3" {
            bucket = "$BACKEND_BUCEKT_NAME"
            key    = "$BACKEND_BUCKET_KEY"
            region = "$BACKEND_BUCKET_REGION"
          }
        }
        EOF

    - uses: opentofu/setup-opentofu@v2
      with:
        tofu_version: ${{ vars.OPENTOFU_VER }}

    - name: Tofu Init
      id: init
      run: tofu init

    - name: Tofu Format
      id: fmt
      run: tofu fmt -check -recursive
      continue-on-error: true

    - name: Tofu Validate
      id: validate
      run: tofu validate

    - name: Tofu Plan
      id: plab
      run: tofu plan -out="tfplan"
      continue-on-error: true

    - name: Tofu Plan Status
      if: steps.plan.outcome == 'failure'
      run: exit 1

    - name: Tofu Apply
      run: tofu apply "tfplan"